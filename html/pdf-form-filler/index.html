                                            });
                                            filledCount++;
                                            logDebug(`🖼 签名图片已嵌入`, fieldName, 'ok');
                                        }
                                    }
                                } else {
                                    // 2) 文字签名：把文字画到页面上
                                    const textVal = (typeof value === 'string' ? value : '').trim();
                                    if (textVal !== '' && rect) {
                                        if (!sigFont) sigFont = await pdfDocLib.embedFont(PDFLib.StandardFonts.Helvetica);
                                        const pages = pdfDocLib.getPages();
                                        const page = pages[info.pageIndex] || pages[0];
                                        if (page) {
                                            const boxH = rect[3] - rect[1];
                                            const size = Math.max(Math.min(boxH - 4, 14), 8);
                                            page.drawText(textVal, {
                                                x: rect[0] + 2,
                                                y: rect[1] + (boxH - size) / 2,
                                                size,
                                                font: sigFont,
                                                color: PDFLib.rgb(0, 0, 0),
                                            });
                                            filledCount++;
                                            logDebug(`✍ 签名已绘制`, `${fieldName} = "${textVal.substring(0, 20)}"`, 'ok');
                                        }
                                    }
                                }

                                // 3) 给字段 dict 添加 PKCS#7 数字签名占位符（仅第一个有值的签名字段）
                                const hasSigValue = (imageDataUrl && rect) ||
                                    (typeof value === 'string' && value.trim() !== '' && rect);
                                if (hasSigValue && !digitalSigRequested && field.acroField && field.acroField.dict) {
                                    const fieldDict = field.acroField.dict;
                                    try {
                                        // 签名字典作为独立的 /V 对象（Acrobat 识别要求，参照 UPDF 的结构）
                                        const sigDictRef = pdfDocLib.context.nextRef();
                                        const sigDict = pdfDocLib.context.obj({
                                            Type: PDFLib.PDFName.of('Sig'),
                                            ByteRange: pdfDocLib.context.obj([
                                                PDFLib.PDFNumber.of(0),
                                                PDFLib.PDFName.of('**********'),
                                                PDFLib.PDFName.of('**********'),
                                                PDFLib.PDFName.of('**********'),
                                            ]),
                                            Contents: PDFLib.PDFHexString.of('0'.repeat(SIG_PLACEHOLDER_HEX_LEN)),
                                            Filter: PDFLib.PDFName.of('Adobe.PPKLite'),
                                            SubFilter: PDFLib.PDFName.of('adbe.pkcs7.detached'),
                                        });
                                        pdfDocLib.context.assign(sigDictRef, sigDict);
                                        fieldDict.set(PDFLib.PDFName.of('V'), sigDictRef);
                                        digitalSigRequested = true;
                                        logDebug('🔐 已准备数字签名占位符', fieldName, 'ok');
                                    } catch (sigErr) {
                                        logDebug('⚠️ 数字签名占位符添加失败', sigErr.message, 'error');
                                    }
                                }
                            } catch (e) {
                                logDebug(`⚠️ 签名处理失败 ${fieldName}`, e.message);
                            }
                        } else {
                            // 未知类型，尝试通用方法
                            try {
                                if (field.setText) {
                                    field.setText(String(value));
                                    filledCount++;
                                } else if (field.check && value === true) {
                                    field.check();
                                    filledCount++;
                                } else if (field.uncheck && value !== true) {
                                    field.uncheck();
                                    filledCount++;
                                }
                            } catch (e) {
                                logDebug(`⚠️ 未知类型填充失败 ${fieldName}`, e.message);
                            }
                        }
                    } catch (e) {
                        logDebug(`⚠️ 填充失败 ${fieldName}`, e.message);
                    }
                }

                // ✅ 额外尝试：用 getField 直接获取字段（兜底）
                for (const [key, value] of Object.entries(formData)) {
                    if (value === undefined || value === null || value === '') continue;
                    try {
                        const field = form.getField(key);
                        if (field) {
                            const fType = getFieldTypeName(field);
                            if (fType === 'PDFCheckBox') {
                                const shouldCheck = value === true || value === 'true' || value === 'Yes' || value ===
                                    'on' || value === '1';
                                if (shouldCheck) field.check();
                                else field.uncheck();
                                filledCount++;
                            } else if (fType === 'PDFTextField' || fType === 'PDFTextArea') {
                                field.setText(String(value));
                                filledCount++;
                            } else if (fType === 'PDFDropdown') {
                                field.select(String(value));
                                filledCount++;
                            }
                        }
                    } catch (e) {
                        // 忽略不存在的字段
                    }
                }

                exportProgressText.textContent = `已填充 ${filledCount} 个字段，正在生成 PDF...`;

                let outputBytes;
                if (digitalSigRequested) {
                    // 有数字签名：字段字典必须以明文对象保存（否则找不到 /ByteRange 占位符）
                    outputBytes = await pdfDocLib.save({ useObjectStreams: false });
                    exportProgressText.textContent = '🔐 正在添加数字签名...';
                    try {
                        outputBytes = await applyDigitalSignature(outputBytes);
                        logDebug('🔐 数字签名已添加（自签名证书）', '', 'ok');
                    } catch (sigErr) {
                        console.error('数字签名失败，回退为普通 PDF:', sigErr);
                        logDebug('⚠️ 数字签名失败，已回退', sigErr.message, 'error');
                    }
                } else {
                    outputBytes = await pdfDocLib.save();
                }

                exportProgressText.textContent = '✅ 生成完成，正在下载...';

                const blob = new Blob([outputBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const baseName = currentFile ? currentFile.name.replace('.pdf', '') : 'form';
                a.download = `${baseName}_filled.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                statusMessage.textContent = `✅ 已导出填充后的 PDF (${filledCount} 个字段)`;

                setTimeout(() => {
                    exportProgress.classList.remove('active');
                }, 500);

            } catch (error) {
                console.error('导出 PDF 失败:', error);
                logDebug('❌ 导出失败', error.message, 'error');

                exportError.textContent = `❌ 导出失败: ${error.message}`;
                exportError.style.display = 'block';
                exportProgressText.textContent = '请尝试导出 JSON 作为替代';

                statusMessage.textContent = '❌ 导出 PDF 失败';

                setTimeout(() => {
                    exportProgress.classList.remove('active');
                }, 3000);
            }
        }

        // --- 导出 JSON ---
        function exportJSON() {
            const data = getFormData();
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `form_data_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            statusMessage.textContent = `✅ 已导出 ${Object.keys(data).length} 个字段的 JSON`;
        }

        // --- 其他操作 ---
        function resetForm() {
            for (const field of allFields) {
                const el = field.element;
                if (el.type === 'checkbox') {
                    el.checked = false;
                    field.checked = false;
                    field.value = false;
                } else if (field.type === 'radio') {
                    if (Array.isArray(field.elements)) {
                        for (const r of field.elements) r.checked = false;
                    } else if (el) {
                        el.checked = false;
                    }
                    field.checked = false;
                    field.value = '';
                } else if (field.type === 'signature') {
                    if (field.ctx && field.canvas) field.ctx.clearRect(0, 0, field.canvas.width, field.canvas.height);
                    if (field.textInput) { field.textInput.value = ''; field.textInput.style.display = 'none'; }
                    if (field.canvas) field.canvas.style.display = 'block';
                    field.value = '';
                    field.signatureImage = null;
                } else if (el.tagName === 'SELECT') {
                    el.selectedIndex = 0;
                    field.value = el.value;
                } else {
                    el.value = '';
                    field.value = '';
                }
            }
            updateFieldList();
            statusMessage.textContent = '已重置所有字段';
        }

        function fillSampleData() {
            let idx = 0;
            for (const field of allFields) {
                const el = field.element;
                if (el.type === 'checkbox') {
                    const shouldCheck = idx % 2 === 0;
                    el.checked = shouldCheck;
                    field.checked = shouldCheck;
                    field.value = shouldCheck;
                    idx++;
                } else if (field.type === 'radio') {
                    if (Array.isArray(field.elements) && field.elements.length > 0) {
                        field.elements[0].checked = true;
                        field.value = field.elements[0].value;
                        field.checked = true;
                    }
                } else if (field.type === 'signature') {
                    field.value = '张三';
                    field.signatureImage = null;
                    if (field.textInput) {
                        field.textInput.value = '张三';
                        field.textInput.style.display = 'block';
                        if (field.canvas) field.canvas.style.display = 'none';
                    }
                } else if (el.tagName === 'SELECT') {
                    if (el.options.length > 1) {
                        el.selectedIndex = 1;
                        field.value = el.value;
                    }
                } else {
                    const sample = `样本_${Math.floor(Math.random() * 1000)}`;
                    el.value = sample;
                    field.value = sample;
                }
            }
            updateFieldList();
            statusMessage.textContent = '已填充示例数据';
        }

        function clearAllFields() {
            for (const field of allFields) {
                const el = field.element;
                if (el.type === 'checkbox') {
                    el.checked = false;
                    field.checked = false;
                    field.value = false;
                } else if (field.type === 'radio') {
                    if (Array.isArray(field.elements)) {
                        for (const r of field.elements) r.checked = false;
                    } else if (el) {
                        el.checked = false;
                    }
                    field.checked = false;
                    field.value = '';
                } else if (field.type === 'signature') {
                    if (field.ctx && field.canvas) field.ctx.clearRect(0, 0, field.canvas.width, field.canvas.height);
                    if (field.textInput) { field.textInput.value = ''; field.textInput.style.display = 'none'; }
                    if (field.canvas) field.canvas.style.display = 'block';
                    field.value = '';
                    field.signatureImage = null;
                } else if (el.tagName === 'SELECT') {
                    el.selectedIndex = 0;
                    field.value = el.value;
                } else {
                    el.value = '';
                    field.value = '';
                }
            }
            updateFieldList();
            statusMessage.textContent = '已清空所有字段';
        }

        // --- 坐标偏移 ---
        function applyOffset() {
            offsetXValue = parseInt(offsetX.value);
            offsetYValue = parseInt(offsetY.value);
            offsetXVal.textContent = offsetXValue;
            offsetYVal.textContent = offsetYValue;
            if (currentFile) {
                parsePDF(currentFile, offsetXValue, offsetYValue);
                statusMessage.textContent = `📍 应用偏移: X=${offsetXValue}, Y=${offsetYValue}`;
            }
        }

        function resetOffset() {
            offsetX.value = 0;
            offsetY.value = 0;
            offsetXVal.textContent = '0';
            offsetYVal.textContent = '0';
            applyOffset();
        }

        // --- 事件绑定 ---
        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                parsePDF(file, 0, 0);
                fileName.textContent = file.name;
            }
        });

        exportPdfBtn.addEventListener('click', exportFilledPDF);
        exportJsonBtn.addEventListener('click', exportJSON);
        resetBtn.addEventListener('click', resetForm);
        clearAllBtn.addEventListener('click', clearAllFields);
        fillSampleBtn.addEventListener('click', fillSampleData);

        applyOffsetBtn.addEventListener('click', applyOffset);
        resetOffsetBtn.addEventListener('click', resetOffset);

        offsetX.addEventListener('input', function() {
            offsetXVal.textContent = this.value;
        });
        offsetY.addEventListener('input', function() {
            offsetYVal.textContent = this.value;
        });

        // 拖拽上传
        document.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'application/pdf') {
                parsePDF(files[0], 0, 0);
                fileInput.files = files;
                fileName.textContent = files[0].name;
            }
        });

        console.log('✅ PDF 表单编辑器 (最终修复版) 已启动');
        console.log('💡 修复了文本字段被误判为 Dropdown 的问题');
    </script>
</body>
</html>
