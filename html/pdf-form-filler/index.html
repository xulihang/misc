<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF 表单编辑器 - 最终修复版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
    </script>
    <!-- 自签名证书 + PKCS#7 数字签名依赖（pkijs/asn1js，esbuild 打包成 IIFE） -->
    <script src="pdfsigner.bundle.js"></script>
    <style>
        /* ... 样式同前，为节省空间省略 ... */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1500px;
            margin: 0 auto;
        }
        .toolbar {
            background: white;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .toolbar .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }
        .toolbar .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #1a73e8;
            color: white;
        }
        .btn-primary:hover {
            background: #1557b0;
        }
        .btn-success {
            background: #34a853;
            color: white;
        }
        .btn-success:hover {
            background: #2d9249;
        }
        .btn-warning {
            background: #fbbc04;
            color: #333;
        }
        .btn-warning:hover {
            background: #e5ac04;
        }
        .btn-danger {
            background: #ea4335;
            color: white;
        }
        .btn-danger:hover {
            background: #d33426;
        }
        .btn-purple {
            background: #7c3aed;
            color: white;
        }
        .btn-purple:hover {
            background: #6d28d9;
        }
        .btn-outline {
            background: transparent;
            color: #1a73e8;
            border: 2px solid #1a73e8;
        }
        .btn-outline:hover {
            background: #1a73e8;
            color: white;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .file-name {
            color: #666;
            font-size: 13px;
            margin-left: 4px;
        }
        .main-layout {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }
        .pdf-wrapper {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            min-height: 500px;
            position: relative;
            overflow: auto;
        }
        #pdf-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .pdf-page {
            position: relative;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
            border-radius: 4px;
            overflow: hidden;
            background: white;
        }
        .pdf-page canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        .form-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        /* 签名画板是 div+canvas，不在 input/textarea/select 之列，需单独恢复可点击 */
        .form-overlay .sig-field {
            pointer-events: auto;
        }
        .form-overlay input,
        .form-overlay textarea,
        .form-overlay select {
            pointer-events: auto;
            border: 2px solid #7c3aed;
            border-radius: 4px;
            background: rgba(124, 58, 237, 0.1);
            font-size: 12px;
            padding: 1px 4px;
            transition: all 0.2s;
            outline: none;
            min-width: 30px;
            min-height: 20px;
            box-sizing: border-box;
            z-index: 20;
        }
        .form-overlay input:hover,
        .form-overlay textarea:hover,
        .form-overlay select:hover {
            background: rgba(124, 58, 237, 0.2);
            border-color: #6d28d9;
        }
        .form-overlay input:focus,
        .form-overlay textarea:focus,
        .form-overlay select:focus {
            background: rgba(124, 58, 237, 0.18);
            border-color: #5b21b6;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25);
        }
        .form-overlay input[type="checkbox"],
        .form-overlay input[type="radio"] {
            width: 16px;
            height: 16px;
            min-width: 16px;
            min-height: 16px;
            border: 2px solid #7c3aed;
            border-radius: 4px;
            accent-color: #7c3aed;
            cursor: pointer;
            background: rgba(124, 58, 237, 0.08);
        }
        .form-overlay input[type="radio"] {
            border-radius: 50%;
        }
        .form-overlay select {
            background: white;
            min-width: 60px;
            padding: 1px 4px;
        }
        .form-field-label {
            position: absolute;
            font-size: 8px;
            color: #7c3aed;
            background: rgba(255, 255, 255, 0.92);
            padding: 1px 4px;
            border-radius: 2px;
            pointer-events: none;
            white-space: nowrap;
            font-weight: 700;
            border: 1px solid rgba(124, 58, 237, 0.25);
            top: -14px;
            left: 2px;
            z-index: 10;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .field-debug-box {
            position: absolute;
            border: 1px dashed rgba(124, 58, 237, 0.2);
            background: rgba(124, 58, 237, 0.03);
            pointer-events: none;
            z-index: 5;
        }

        .field-sidebar {
            width: 340px;
            min-width: 340px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            max-height: 700px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 16px;
        }
        .field-sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e9ecef;
            font-weight: 600;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            font-size: 13px;
        }
        .field-sidebar-header .count {
            background: #7c3aed;
            color: white;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 11px;
        }
        .field-list {
            overflow-y: auto;
            padding: 4px 0;
            flex: 1;
            min-height: 80px;
        }
        .field-list .field-item {
            padding: 2px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            border-bottom: 1px solid #f1f3f5;
            cursor: pointer;
            transition: background 0.15s;
            gap: 4px;
        }
        .field-list .field-item:hover {
            background: #f5f0ff;
        }
        .field-list .field-item .name {
            color: #333;
            font-weight: 500;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 10px;
        }
        .field-list .field-item .type {
            color: #888;
            font-size: 8px;
            background: #f1f3f5;
            padding: 1px 6px;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .field-list .empty-msg {
            padding: 30px 20px;
            text-align: center;
            color: #aaa;
            font-size: 13px;
        }
        .field-sidebar-footer {
            padding: 8px 12px;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .field-sidebar-footer .btn {
            font-size: 10px;
            padding: 3px 8px;
            flex: 1;
        }

        .status-bar {
            margin-top: 12px;
            padding: 10px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .debug-panel {
            margin-top: 12px;
            background: #1e1e1e;
            border-radius: 8px;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px 12px;
        }
        .debug-panel .log-line {
            padding: 1px 0;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            gap: 8px;
        }
        .debug-panel .log-line .time {
            color: #6a9955;
            flex-shrink: 0;
        }
        .debug-panel .log-line .tag {
            color: #569cd6;
            font-weight: bold;
            flex-shrink: 0;
        }
        .debug-panel .log-line .value {
            color: #ce9178;
            word-break: break-all;
        }
        .debug-panel .log-line .value-ok {
            color: #4ec9b0;
        }
        .debug-panel .log-line .value-error {
            color: #f48771;
        }

        .offset-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            padding: 6px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin: 4px 0;
        }
        .offset-controls label {
            font-size: 11px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .offset-controls input[type="range"] {
            width: 80px;
            accent-color: #7c3aed;
        }
        .offset-controls .offset-value {
            font-size: 11px;
            font-weight: 600;
            color: #7c3aed;
            min-width: 30px;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: #888;
            font-size: 15px;
            flex-direction: column;
            gap: 12px;
        }
        .loading .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e9ecef;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .export-progress {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .export-progress.active {
            display: flex;
        }
        .export-progress .box {
            background: white;
            padding: 40px 50px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }
        .export-progress .box .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e9ecef;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        .export-progress .box .title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .export-progress .box .sub {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
        }
        .export-progress .box .error-text {
            color: #ea4335;
            font-size: 13px;
            margin-top: 8px;
        }

        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
            }
            .field-sidebar {
                width: 100%;
                min-width: unset;
                max-height: 350px;
                position: static;
            }
        }
        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .offset-controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="toolbar">
            <div class="file-input-wrapper">
                <button class="btn btn-primary">📄 选择 PDF</button>
                <input type="file" id="fileInput" accept=".pdf" />
            </div>
            <span class="file-name" id="fileName">未选择文件</span>
            <div style="flex:1"></div>
            <button class="btn btn-purple" id="exportPdfBtn" disabled>📥 导出填充后的 PDF</button>
            <button class="btn btn-success" id="exportJsonBtn" disabled>📋 导出 JSON</button>
            <button class="btn btn-danger" id="resetBtn" disabled>↩️ 重置</button>
        </div>

        <div class="main-layout">
            <div class="pdf-wrapper">
                <div class="offset-controls" id="offsetControls" style="display:none;">
                    <span style="font-size:11px;font-weight:600;color:#333;">📍 坐标微调</span>
                    <label>
                        X偏移
                        <input type="range" id="offsetX" min="-50" max="50" value="0" step="1" />
                        <span class="offset-value" id="offsetXVal">0</span>
                    </label>
                    <label>
                        Y偏移
                        <input type="range" id="offsetY" min="-50" max="50" value="0" step="1" />
                        <span class="offset-value" id="offsetYVal">0</span>
                    </label>
                    <button class="btn btn-primary btn-sm" id="applyOffsetBtn">应用</button>
                    <button class="btn btn-outline btn-sm" id="resetOffsetBtn">重置</button>
                </div>

                <div id="pdf-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>上传包含表单的 PDF 文件</span>
                        <span style="font-size:13px;color:#aaa;">支持 AcroForm 表单</span>
                    </div>
                </div>
                <div class="debug-panel" id="debugPanel">
                    <div id="debugContent">等待加载 PDF...</div>
                </div>
            </div>

            <div class="field-sidebar">
                <div class="field-sidebar-header">
                    <span>📋 表单字段</span>
                    <span class="count" id="sidebarCount">0</span>
                </div>
                <div class="field-list" id="fieldList">
                    <div class="empty-msg">暂无字段</div>
                </div>
                <div class="field-sidebar-footer">
                    <button class="btn btn-warning" id="clearAllBtn">清空</button>
                    <button class="btn btn-success" id="fillSampleBtn">填充示例</button>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <span>📋 字段: <span id="fieldCount">0</span></span>
            <span id="pageInfo">页码: -</span>
            <span id="statusMessage">就绪</span>
        </div>
    </div>

    <div class="export-progress" id="exportProgress">
        <div class="box">
            <div class="spinner"></div>
            <div class="title" id="exportTitle">正在生成 PDF...</div>
            <div class="sub" id="exportProgressText">请稍候</div>
            <div class="error-text" id="exportError" style="display:none;"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // --- DOM ---
        const container = document.getElementById('pdf-container');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const fieldCountEl = document.getElementById('fieldCount');
        const sidebarCount = document.getElementById('sidebarCount');
        const fieldList = document.getElementById('fieldList');
        const pageInfoEl = document.getElementById('pageInfo');
        const statusMessage = document.getElementById('statusMessage');
        const exportPdfBtn = document.getElementById('exportPdfBtn');
        const exportJsonBtn = document.getElementById('exportJsonBtn');
        const resetBtn = document.getElementById('resetBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const fillSampleBtn = document.getElementById('fillSampleBtn');
        const debugContent = document.getElementById('debugContent');
        const offsetControls = document.getElementById('offsetControls');
        const offsetX = document.getElementById('offsetX');
        const offsetY = document.getElementById('offsetY');
        const offsetXVal = document.getElementById('offsetXVal');
        const offsetYVal = document.getElementById('offsetYVal');
        const applyOffsetBtn = document.getElementById('applyOffsetBtn');
        const resetOffsetBtn = document.getElementById('resetOffsetBtn');
        const exportProgress = document.getElementById('exportProgress');
        const exportProgressText = document.getElementById('exportProgressText');
        const exportTitle = document.getElementById('exportTitle');
        const exportError = document.getElementById('exportError');

        // --- 状态 ---
        let pdfDoc = null;
        let allFields = [];
        let fieldIdCounter = 0;
        let debugLogs = [];
        let currentFile = null;
        let offsetXValue = 0;
        let offsetYValue = 0;
        let originalPdfData = null;

        // --- 调试 ---
        function logDebug(tag, value, type = 'info') {
            const time = new Date().toLocaleTimeString();
            debugLogs.push({ time, tag, value, type });
            renderDebug();
        }

        function renderDebug() {
            const html = debugLogs.map(log =>
                `<div class="log-line">
                            <span class="time">[${log.time}]</span>
                            <span class="tag">${log.tag}:</span>
                            <span class="value ${log.type === 'error' ? 'value-error' : log.type === 'ok' ? 'value-ok' : ''}">${typeof log.value === 'object' ? JSON.stringify(log.value, null, 2) : log.value}</span>
                        </div>`
            ).join('');
            debugContent.innerHTML = html || '等待加载...';
            const panel = document.getElementById('debugPanel');
            panel.scrollTop = panel.scrollHeight;
        }

        // --- 工具 ---
        function truncate(str, len = 20) {
            if (!str) return '';
            return str.length > len ? str.substring(0, len) + '...' : str;
        }

        function generateFieldId() {
            return `field_${++fieldIdCounter}`;
        }

        // --- 坐标转换 ---
        function pdfToCssRect(pdfRect, pageHeight, scale, offsetX = 0, offsetY = 0) {
            if (!pdfRect || pdfRect.length < 4) return null;
            const x1 = pdfRect[0];
            const y1 = pdfRect[1];
            const x2 = pdfRect[2];
            const y2 = pdfRect[3];
            let left = x1 * scale + offsetX;
            let top = (pageHeight - y2) * scale + offsetY;
            let width = (x2 - x1) * scale;
            let height = (y2 - y1) * scale;
            if (width < 8) width = 8;
            if (height < 8) height = 8;
            return {
                left: Math.max(left, 0),
                top: Math.max(top, 0),
                width: width,
                height: height
            };
        }

        // --- 核心解析 ---
        async function parsePDF(file, offsetX = 0, offsetY = 0) {
            try {
                debugLogs = [];
                currentFile = file;
                logDebug('📂 开始解析', file.name);

                const arrayBuffer = await file.arrayBuffer();
                originalPdfData = new Uint8Array(arrayBuffer);

                logDebug('📄 文件大小', `${(originalPdfData.length / 1024).toFixed(1)} KB`);

                const headerStr = new TextDecoder().decode(originalPdfData.slice(0, 8));
                logDebug('📄 PDF 头部', headerStr);

                if (!headerStr.startsWith('%PDF')) {
                    const pdfStart = originalPdfData.indexOf('%PDF');
                    if (pdfStart > 0) {
                        originalPdfData = new Uint8Array(originalPdfData.slice(pdfStart));
                        logDebug('🔧 修复', `从位置 ${pdfStart} 截取`, 'ok');
                    }
                }

                pdfDoc = await pdfjsLib.getDocument({ data: originalPdfData.slice(0) }).promise;
                logDebug('✅ PDF 加载成功', `共 ${pdfDoc.numPages} 页`, 'ok');

                const pages = [];
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    pages.push(page);
                }

                allFields = [];
                fieldIdCounter = 0;

                await renderPages(pdfDoc);

                logDebug('🔍 从 annotations 提取');
                let annotationFields = [];

                for (let i = 0; i < pages.length; i++) {
                    const page = pages[i];
                    try {
                        const annotations = await page.getAnnotations();
                        for (const ann of annotations) {
                            if (ann.subtype === 'Widget' || ann.fieldType) {
                                if (ann.rect && ann.rect.length === 4) {
                                    const valid = ann.rect.every(v => v !== 0 && isFinite(v) && v >= 0);
                                    if (valid) {
                                        annotationFields.push({
                                            name: ann.fieldName || ann.name || `field_${i}_${annotationFields.length}`,
                                            type: ann.fieldType || ann.subtype || 'text',
                                            value: ann.fieldValue || ann.value || '',
                                            rect: ann.rect,
                                            pageIndex: i,
                                            checked: ann.checked || false,
                                            source: 'annotation',
                                        });
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        logDebug(`⚠️ 页面 ${i+1} 错误`, e.message);
                    }
                }

                logDebug(`📊 annotations`, `找到 ${annotationFields.length} 个有效字段`, annotationFields.length > 0 ? 'ok' : 'info');

                let fieldNames = [];
                let pdfFieldObjects = null;
                try {
                    pdfFieldObjects = await pdfDoc.getFieldObjects();
                    if (pdfFieldObjects) {
                        fieldNames = Object.keys(pdfFieldObjects);
                        logDebug(`📊 getFieldObjects`, `${fieldNames.length} 个字段名`, fieldNames.length > 0 ? 'ok' : 'info');
                        if (fieldNames.length > 0) {
                            logDebug('📋 字段名示例', fieldNames.slice(0, 8).join(', '));
                        }
                    }
                } catch (e) {
                    logDebug('⚠️ getFieldObjects 失败', e.message);
                }

                // 用 pdf-lib 解析字段结构（权威的类型 / 选项 / 当前值）
                const libFieldMap = {};
                try {
                    const libDoc = await PDFLib.PDFDocument.load(originalPdfData.slice(0), { ignoreEncryption: true });
                    const libForm = libDoc.getForm();
                    for (const f of libForm.getFields()) {
                        try { libFieldMap[f.getName()] = f; } catch (e) { /* 忽略单个字段异常 */ }
                    }
                    logDebug('📦 pdf-lib 结构解析', `${Object.keys(libFieldMap).length} 个字段`, 'ok');
                } catch (e) {
                    logDebug('⚠️ pdf-lib 结构解析失败', e.message, 'error');
                }

                // pdf.js fieldObjects 的友好类型兜底（pdf-lib 失败时用）
                const jsTypeByField = {};
                if (pdfFieldObjects) {
                    for (const [k, objs] of Object.entries(pdfFieldObjects)) {
                        const kid = objs.find(o => o.type);
                        if (kid) jsTypeByField[k] = kid.type;
                    }
                }

                let fieldsToRender = [];

                if (annotationFields.length > 0) {
                    // 按字段名分组（单选组有多个同名 annotation，对应多个选项）
                    const annByField = {};
                    for (const ann of annotationFields) {
                        if (!annByField[ann.name]) annByField[ann.name] = [];
                        annByField[ann.name].push(ann);
                    }

                    for (const [name, anns] of Object.entries(annByField)) {
                        const first = anns[0];
                        const libField = libFieldMap[name];
                        const libType = libField ? getFieldTypeName(libField) : '';
                        const jsType = jsTypeByField[name];

                        if (libType === 'PDFRadioGroup' || (libType === '' && jsType === 'radiobutton')) {
                            // 单选组：一个逻辑字段，多个选项
                            const options = (libField && typeof libField.getOptions === 'function') ? (libField.getOptions() || []) : [];
                            const radioOptions = anns.map((ann, i) => ({
                                value: options[i] !== undefined ? options[i]
                                    : (ann.buttonValue !== undefined ? String(ann.buttonValue) : String(i)),
                                rect: ann.rect,
                            }));
                            let selected = '';
                            if (libField && typeof libField.getSelected === 'function') {
                                const s = libField.getSelected();
                                if (typeof s === 'string') selected = s;
                            }
                            fieldsToRender.push({
                                name, type: 'radio', rect: first.rect, pageIndex: first.pageIndex,
                                value: selected, checked: selected !== '', source: 'annotation',
                                radioOptions, choices: radioOptions.map(o => o.value),
                            });
                        } else if (libType === 'PDFCheckBox' || (libType === '' && jsType === 'checkbox')) {
                            let checked = false;
                            if (libField && typeof libField.isChecked === 'function') checked = libField.isChecked();
                            else if (anns[0] && anns[0].fieldValue && String(anns[0].fieldValue) !== 'Off') checked = true;
                            fieldsToRender.push({
                                name, type: 'checkbox', rect: first.rect, pageIndex: first.pageIndex,
                                checked, value: checked, source: 'annotation',
                            });
                        } else if (libType === 'PDFDropdown' || libType === 'PDFListBox' ||
                                   (libType === '' && (jsType === 'combobox' || jsType === 'listbox'))) {
                            let choices = [];
                            if (libField && typeof libField.getOptions === 'function') choices = libField.getOptions() || [];
                            if (choices.length === 0 && Array.isArray(first.options)) {
                                choices = first.options.map(o => o.displayValue || o.exportValue);
                            }
                            let sel = '';
                            if (libField && typeof libField.getSelected === 'function') {
                                const s = libField.getSelected();
                                sel = Array.isArray(s) ? (s[0] || '') : (s || '');
                            } else if (Array.isArray(first.fieldValue)) {
                                sel = first.fieldValue[0] || '';
                            }
                            fieldsToRender.push({
                                name, type: 'select', rect: first.rect, pageIndex: first.pageIndex,
                                value: sel, checked: false, source: 'annotation', choices,
                            });
                        } else if (libType === 'PDFSignature' ||
                                   (libType === '' && (jsType === 'signature' || String(first.type).toLowerCase() === 'sig'))) {
                            // 签名字段：渲染成签名框，导出时把文字画到页面上
                            fieldsToRender.push({
                                name, type: 'signature', rect: first.rect, pageIndex: first.pageIndex,
                                value: '', checked: false, source: 'annotation',
                            });
                        } else {
                            // 文本 / 多行文本
                            let textVal = '';
                            if (libField && typeof libField.getText === 'function') textVal = libField.getText() || '';
                            else textVal = first.value || '';
                            fieldsToRender.push({
                                name, type: first.multiLine ? 'textarea' : 'text', rect: first.rect, pageIndex: first.pageIndex,
                                value: textVal, checked: false, source: 'annotation',
                            });
                        }
                    }
                    logDebug('✅ 使用 annotations + pdf-lib', `${fieldsToRender.length} 个字段 (有坐标)`, 'ok');
                } else if (fieldNames.length > 0) {
                    logDebug('🔄 使用字段名生成', `${fieldNames.length} 个字段 (无坐标)`);
                    const firstPage = pages[0];
                    const viewport = firstPage.getViewport({ scale: 1 });
                    const pageWidth = viewport.width;

                    for (let i = 0; i < fieldNames.length; i++) {
                        const cols = 3;
                        const row = Math.floor(i / cols);
                        const col = i % cols;
                        const x = 40 + col * (pageWidth / cols);
                        const y = 40 + row * 35;
                        fieldsToRender.push({
                            name: fieldNames[i],
                            type: 'text',
                            value: '',
                            rect: [x, y, x + 140, y + 28],
                            pageIndex: 0,
                            checked: false,
                            source: 'generated',
                        });
                    }
                    logDebug('✅ 生成完成', `${fieldsToRender.length} 个字段`, 'ok');
                }

                let rendered = 0;
                const pageHeightMap = {};
                for (let i = 0; i < pages.length; i++) {
                    const vp = pages[i].getViewport({ scale: 1 });
                    pageHeightMap[i] = vp.height;
                }
                const scale = 1.5;

                for (const field of fieldsToRender) {
                    const success = await renderField(field, pageHeightMap, scale, offsetX, offsetY);
                    if (success) rendered++;
                }

                logDebug(`✅ 渲染完成`, `${rendered}/${fieldsToRender.length} 个字段`, 'ok');

                fieldCountEl.textContent = allFields.length;
                sidebarCount.textContent = allFields.length;
                pageInfoEl.textContent = `共 ${pdfDoc.numPages} 页`;
                statusMessage.textContent = `✅ 已加载 ${allFields.length} 个字段`;

                exportPdfBtn.disabled = false;
                exportJsonBtn.disabled = false;
                resetBtn.disabled = false;
                offsetControls.style.display = 'flex';

                updateFieldList();

                if (allFields.length === 0) {
                    statusMessage.textContent = '⚠️ 未检测到表单字段';
                }

            } catch (error) {
                console.error('解析失败:', error);
                logDebug('❌ 解析失败', error.message, 'error');
                statusMessage.textContent = '❌ 解析失败';
            }
        }

        async function renderPages(doc) {
            container.innerHTML = '';
            const scale = 1.5;

            for (let i = 1; i <= doc.numPages; i++) {
                const page = await doc.getPage(i);
                const viewport = page.getViewport({ scale });

                const pageDiv = document.createElement('div');
                pageDiv.className = 'pdf-page';
                pageDiv.dataset.pageIndex = i - 1;

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.width = viewport.width + 'px';
                canvas.style.height = viewport.height + 'px';

                const context = canvas.getContext('2d');
                await page.render({ canvasContext: context, viewport }).promise;

                const overlay = document.createElement('div');
                overlay.className = 'form-overlay';
                overlay.style.width = viewport.width + 'px';
                overlay.style.height = viewport.height + 'px';

                pageDiv.appendChild(canvas);
                pageDiv.appendChild(overlay);
                container.appendChild(pageDiv);

                pageDiv.dataset.pageHeight = viewport.height;
                pageDiv.dataset.scale = scale;
            }
        }

        async function renderField(field, pageHeightMap, scale, offsetX, offsetY) {
            const pageIndex = field.pageIndex || 0;
            const pageDiv = container.children[pageIndex];
            if (!pageDiv) return false;

            const pageHeight = pageHeightMap[pageIndex] || parseFloat(pageDiv.dataset.pageHeight);

            let rect = field.rect;
            let cssRect;

            if (rect && rect.length === 4) {
                cssRect = pdfToCssRect(rect, pageHeight, scale, offsetX, offsetY);
            } else {
                const idx = allFields.length;
                const col = idx % 3;
                const row = Math.floor(idx / 3);
                cssRect = {
                    left: 50 + col * 200 + offsetX,
                    top: 50 + row * 40 + offsetY,
                    width: 160,
                    height: 28
                };
            }

            cssRect.width = Math.max(cssRect.width, 30);
            cssRect.height = Math.max(cssRect.height, 20);

            const fieldType = field.type || 'text';
            const fieldValue = field.value || '';

            // 签名字段：画板（手绘 / 上传图片 / 文字）
            if (fieldType === 'signature') {
                return renderSignatureField(field, pageHeight, scale, offsetX, offsetY, pageDiv, cssRect, pageIndex);
            }

            // 单选组：一个逻辑字段，渲染多个单选选项（共享 fieldId）
            if (fieldType === 'radio' && Array.isArray(field.radioOptions) && field.radioOptions.length > 0) {
                const fieldId = generateFieldId();
                const overlay = pageDiv.querySelector('.form-overlay');
                const groupName = `radio_${field.name}`;
                const elements = [];
                let groupCssRect = null;

                for (const opt of field.radioOptions) {
                    if (!opt || !opt.rect || opt.rect.length !== 4) continue;
                    const optCss = pdfToCssRect(opt.rect, pageHeight, scale, offsetX, offsetY);
                    if (!optCss) continue;
                    if (!groupCssRect) groupCssRect = optCss;

                    const size = Math.max(Math.min(optCss.width, optCss.height, 20), 12);
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = groupName;
                    radio.value = opt.value;
                    radio.checked = fieldValue !== '' && String(fieldValue) === String(opt.value);
                    radio.style.position = 'absolute';
                    radio.style.left = (optCss.left + optCss.width / 2 - size / 2) + 'px';
                    radio.style.top = (optCss.top + optCss.height / 2 - size / 2) + 'px';
                    radio.style.width = size + 'px';
                    radio.style.height = size + 'px';
                    radio.style.minWidth = size + 'px';
                    radio.style.minHeight = size + 'px';
                    radio.style.borderRadius = '50%';
                    radio.style.accentColor = '#7c3aed';
                    radio.style.zIndex = '20';
                    radio.style.cursor = 'pointer';
                    radio.dataset.fieldId = fieldId;
                    radio.addEventListener('change', function() { updateRadioValue(fieldId, this); });
                    overlay.appendChild(radio);
                    elements.push(radio);
                }

                if (elements.length === 0) return false;

                if (groupCssRect) {
                    const debugBox = document.createElement('div');
                    debugBox.className = 'field-debug-box';
                    debugBox.style.left = groupCssRect.left + 'px';
                    debugBox.style.top = groupCssRect.top + 'px';
                    debugBox.style.width = Math.max(groupCssRect.width, 30) + 'px';
                    debugBox.style.height = Math.max(groupCssRect.height, 20) + 'px';
                    overlay.appendChild(debugBox);
                }

                const label = document.createElement('span');
                label.className = 'form-field-label';
                label.textContent = truncate(field.name, 20);
                if (groupCssRect) {
                    label.style.left = groupCssRect.left + 'px';
                    label.style.top = (groupCssRect.top - 14) + 'px';
                }
                overlay.appendChild(label);

                const fieldInfo = {
                    id: fieldId,
                    pageIndex: pageIndex,
                    name: field.name,
                    type: 'radio',
                    value: fieldValue,
                    rect: groupCssRect,
                    rawRect: field.rect,
                    element: elements[0],
                    elements: elements,
                    label: label,
                    checked: fieldValue !== '',
                    choices: field.choices || field.radioOptions.map(o => o.value),
                    source: field.source || 'unknown',
                };
                allFields.push(fieldInfo);
                return true;
            }

            const debugBox = document.createElement('div');
            debugBox.className = 'field-debug-box';
            debugBox.style.left = cssRect.left + 'px';
            debugBox.style.top = cssRect.top + 'px';
            debugBox.style.width = cssRect.width + 'px';
            debugBox.style.height = cssRect.height + 'px';

            const element = createFormElement(fieldType, fieldValue, cssRect);

            // 下拉框/列表框：用 PDF 里的实际选项填充
            if (element.tagName === 'SELECT' && Array.isArray(field.choices) && field.choices.length > 0) {
                element.innerHTML = '';
                const hasValue = fieldValue !== undefined && fieldValue !== null && fieldValue !== '';
                if (!hasValue) {
                    const ph = document.createElement('option');
                    ph.value = '';
                    ph.textContent = '请选择';
                    element.appendChild(ph);
                }
                for (const opt of field.choices) {
                    const o = document.createElement('option');
                    o.value = opt;
                    o.textContent = opt;
                    if (hasValue && String(opt) === String(fieldValue)) o.selected = true;
                    element.appendChild(o);
                }
                if (hasValue) element.value = fieldValue;
            }

            const label = document.createElement('span');
            label.className = 'form-field-label';
            label.textContent = truncate(field.name, 20);
            label.style.left = cssRect.left + 'px';
            label.style.top = (cssRect.top - 14) + 'px';

            const overlay = pageDiv.querySelector('.form-overlay');
            overlay.appendChild(debugBox);
            overlay.appendChild(element);
            overlay.appendChild(label);

            const fieldId = generateFieldId();
            const fieldInfo = {
                id: fieldId,
                pageIndex: pageIndex,
                name: field.name,
                type: fieldType,
                value: fieldValue,
                rect: cssRect,
                rawRect: rect,
                element: element,
                label: label,
                checked: field.checked || false,
                source: field.source || 'unknown',
            };
            allFields.push(fieldInfo);

            element.dataset.fieldId = fieldId;

            element.addEventListener('change', function(e) {
                updateFieldValue(fieldId, this);
            });

            return true;
        }

        // 签名字段：画板，支持手绘 / 上传图片 / 输入文字
        function renderSignatureField(field, pageHeight, scale, offsetX, offsetY, pageDiv, cssRect, pageIndex) {
            const fieldId = generateFieldId();
            const overlay = pageDiv.querySelector('.form-overlay');

            // 容器
            const container = document.createElement('div');
            container.className = 'sig-field';
            container.style.position = 'absolute';
            container.style.left = cssRect.left + 'px';
            container.style.top = cssRect.top + 'px';
            container.style.width = cssRect.width + 'px';
            container.style.height = cssRect.height + 'px';
            container.style.border = '2px dashed #7c3aed';
            container.style.borderRadius = '3px';
            container.style.background = 'rgba(124, 58, 237, 0.05)';
            container.style.zIndex = '20';
            container.style.overflow = 'hidden';
            container.style.boxSizing = 'border-box';

            // 画布（高度留出底部工具栏）
            const cw = Math.max(Math.floor(cssRect.width) - 4, 50);
            const ch = Math.max(Math.floor(cssRect.height) - 24, 30);
            const canvas = document.createElement('canvas');
            canvas.width = cw;
            canvas.height = ch;
            canvas.style.position = 'absolute';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            canvas.style.cursor = 'crosshair';
            canvas.style.touchAction = 'none';
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#1a1a2e';

            // 工具栏
            const toolbar = document.createElement('div');
            toolbar.style.position = 'absolute';
            toolbar.style.bottom = '0';
            toolbar.style.left = '0';
            toolbar.style.right = '0';
            toolbar.style.display = 'flex';
            toolbar.style.background = '#fff';
            toolbar.style.borderTop = '1px solid #ddd';
            toolbar.style.zIndex = '22';
            toolbar.innerHTML =
                `<button type="button" data-act="draw" style="flex:1;font-size:10px;border:none;background:none;cursor:pointer" title="手绘">✏</button>` +
                `<button type="button" data-act="upload" style="flex:1;font-size:10px;border:none;background:none;cursor:pointer" title="上传图片">🖼</button>` +
                `<button type="button" data-act="text" style="flex:1;font-size:10px;border:none;background:none;cursor:pointer" title="输入文字">🔤</button>` +
                `<button type="button" data-act="clear" style="flex:1;font-size:10px;border:none;background:none;cursor:pointer" title="清除">🗑</button>`;
            container.appendChild(toolbar);

            // 隐藏的文件上传
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/png,image/jpeg';
            fileInput.style.display = 'none';
            container.appendChild(fileInput);

            // 隐藏的文字输入（文字模式）
            const textInput = document.createElement('input');
            textInput.type = 'text';
            textInput.placeholder = '输入签名文字';
            textInput.style.display = 'none';
            textInput.style.position = 'absolute';
            textInput.style.top = '0';
            textInput.style.left = '0';
            textInput.style.width = '100%';
            textInput.style.height = ch + 'px';
            textInput.style.border = 'none';
            textInput.style.outline = 'none';
            textInput.style.fontFamily = '"Segoe Script", "Brush Script MT", cursive';
            textInput.style.fontSize = '16px';
            textInput.style.background = 'transparent';
            textInput.style.padding = '0 6px';
            container.appendChild(textInput);

            // 字段标签
            const label = document.createElement('span');
            label.className = 'form-field-label';
            label.textContent = truncate(field.name, 20);
            label.style.left = cssRect.left + 'px';
            label.style.top = (cssRect.top - 14) + 'px';
            overlay.appendChild(label);
            overlay.appendChild(container);

            const fieldInfo = {
                id: fieldId,
                pageIndex: pageIndex,
                name: field.name,
                type: 'signature',
                value: '',           // 文字模式的内容
                signatureImage: null, // 手绘/上传的 PNG dataURL
                rect: cssRect,
                rawRect: field.rect,
                element: container,
                elements: [container],
                label: label,
                checked: false,
                source: field.source || 'unknown',
                canvas: canvas,
                ctx: ctx,
                textInput: textInput,
            };
            allFields.push(fieldInfo);

            // 手绘
            let drawing = false;
            const pos = (e) => {
                const r = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - r.left) * (canvas.width / r.width),
                    y: (e.clientY - r.top) * (canvas.height / r.height),
                };
            };
            const capture = () => {
                fieldInfo.signatureImage = canvas.toDataURL('image/png');
                updateFieldList();
            };
            const start = (e) => {
                drawing = true;
                canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
                const p = pos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            };
            const move = (e) => {
                if (!drawing) return;
                const p = pos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            };
            const stop = () => {
                if (!drawing) return;
                drawing = false;
                capture();
            };
            canvas.addEventListener('pointerdown', start);
            canvas.addEventListener('pointermove', move);
            canvas.addEventListener('pointerup', stop);
            canvas.addEventListener('pointerleave', stop);

            const setDrawMode = () => {
                canvas.style.display = 'block';
                textInput.style.display = 'none';
            };
            const setTextMode = () => {
                canvas.style.display = 'none';
                textInput.style.display = 'block';
                textInput.focus();
                // 切到文字模式时，手绘图片作废
                if (!fieldInfo.value) fieldInfo.signatureImage = null;
            };

            textInput.addEventListener('input', () => {
                fieldInfo.value = textInput.value;
                if (textInput.value.trim() === '') fieldInfo.signatureImage = null;
                updateFieldList();
            });

            toolbar.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;
                const act = btn.dataset.act;
                if (act === 'clear') {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    fieldInfo.signatureImage = null;
                    fieldInfo.value = '';
                    textInput.value = '';
                    setDrawMode();
                    updateFieldList();
                } else if (act === 'upload') {
                    fileInput.click();
                } else if (act === 'text') {
                    setTextMode();
                } else if (act === 'draw') {
                    setDrawMode();
                }
            });

            fileInput.addEventListener('change', () => {
                const file = fileInput.files && fileInput.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        setDrawMode();
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const s = Math.min(canvas.width / img.width, canvas.height / img.height, 1);
                        const w = img.width * s;
                        const h = img.height * s;
                        ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
                        fieldInfo.signatureImage = canvas.toDataURL('image/png');
                        fieldInfo.value = '';
                        updateFieldList();
                    };
                    img.onerror = () => { logDebug('⚠️ 图片加载失败', file.name); };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            return true;
        }

        function createFormElement(type, value, rect) {
            let element;
            const baseType = (type || 'text').toLowerCase();

            switch (baseType) {
                case 'text':
                case 'tx':
                    element = document.createElement('input');
                    element.type = 'text';
                    element.value = value || '';
                    break;
                case 'textarea':
                    element = document.createElement('textarea');
                    element.value = value || '';
                    element.style.resize = 'none';
                    break;
                case 'checkbox':
                    element = document.createElement('input');
                    element.type = 'checkbox';
                    if (typeof value === 'boolean') {
                        element.checked = value;
                    } else if (value === 'Yes' || value === 'On' || value === 'true' || value === '1') {
                        element.checked = true;
                    } else {
                        element.checked = false;
                    }
                    break;
                case 'radio':
                    element = document.createElement('input');
                    element.type = 'radio';
                    element.checked = !!value;
                    element.name = `radio_${Date.now()}`;
                    break;
                case 'select':
                    element = document.createElement('select');
                    element.innerHTML = `<option value="">请选择</option><option value="1">选项1</option><option value="2">选项2</option>`;
                    break;
                case 'signature':
                    element = document.createElement('input');
                    element.type = 'text';
                    element.value = value || '';
                    element.placeholder = '✍ 输入签名';
                    break;
                default:
                    element = document.createElement('input');
                    element.type = 'text';
                    element.value = value || '';
                    break;
            }

            element.style.position = 'absolute';
            element.style.left = rect.left + 'px';
            element.style.top = rect.top + 'px';
            element.style.width = rect.width + 'px';
            element.style.height = rect.height + 'px';
            element.style.fontSize = '11px';
            element.style.padding = '1px 4px';
            element.style.zIndex = '20';
            element.style.borderRadius = '3px';
            element.style.border = '2px solid #7c3aed';
            element.style.background = 'rgba(124, 58, 237, 0.1)';
            element.style.outline = 'none';

            if (baseType === 'checkbox' || baseType === 'radio') {
                const size = Math.min(rect.width, rect.height, 20);
                element.style.width = size + 'px';
                element.style.height = size + 'px';
                element.style.top = (rect.top + rect.height / 2 - size / 2) + 'px';
                element.style.left = (rect.left + rect.width / 2 - size / 2) + 'px';
                element.style.minWidth = size + 'px';
                element.style.minHeight = size + 'px';
                element.style.borderRadius = baseType === 'checkbox' ? '3px' : '50%';
                element.style.accentColor = '#7c3aed';
            }

            if (baseType === 'select') {
                element.style.background = 'white';
                element.style.minWidth = '80px';
            }

            if (baseType === 'signature') {
                element.style.borderStyle = 'dashed';
                element.style.fontFamily = '"Segoe Script", "Brush Script MT", cursive, cursive';
                element.style.fontSize = '16px';
                element.style.background = 'rgba(124, 58, 237, 0.05)';
                element.style.padding = '2px 8px';
            }

            return element;
        }

        function updateFieldValue(fieldId, element) {
            const field = allFields.find(f => f.id === fieldId);
            if (!field) return;

            if (element.type === 'checkbox') {
                field.checked = element.checked;
                field.value = element.checked;
            } else if (element.type === 'radio') {
                // 单选组：仅在选中时记录选中的选项值
                if (element.checked) {
                    field.value = element.value;
                    field.checked = true;
                }
            } else if (element.tagName === 'SELECT') {
                field.value = element.value;
            } else {
                field.value = element.value;
            }

            updateFieldList();
        }

        // 单选组选项变化（共享同一个 fieldId）
        function updateRadioValue(fieldId, element) {
            if (!element.checked) return;
            const field = allFields.find(f => f.id === fieldId);
            if (!field) return;
            field.value = element.value;
            field.checked = true;
            updateFieldList();
        }

        function updateFieldList() {
            if (allFields.length === 0) {
                fieldList.innerHTML = `<div class="empty-msg">暂无字段</div>`;
                return;
            }

            let html = '';
            for (const field of allFields) {
                let displayValue;
                if (field.type === 'checkbox') {
                    displayValue = field.checked ? '☑ 已勾选' : '☐ 未勾选';
                } else if (field.type === 'radio') {
                    displayValue = field.value ? '☑ ' + truncate(String(field.value), 8) : '☐ 未选';
                } else if (field.type === 'signature') {
                    displayValue = field.signatureImage ? '🖼 图片签名' : (field.value ? '✍ ' + truncate(String(field.value), 8) : '空');
                } else {
                    displayValue = truncate(String(field.value || ''), 8);
                }

                const sourceIcon = field.source === 'annotation' ? '📌' :
                    field.source === 'matched_text' ? '🔗' : '🔄';

                html += `
                            <div class="field-item" data-field-id="${field.id}">
                                <span>${sourceIcon}</span>
                                <span class="name">${truncate(field.name, 18)}</span>
                                <span class="type">${field.type}</span>
                                <span>${displayValue}</span>
                            </div>
                        `;
            }
            fieldList.innerHTML = html;
            sidebarCount.textContent = allFields.length;
        }

        // --- 获取表单数据 ---
        function getFormData() {
            const data = {};
            for (const field of allFields) {
                let key = field.name;
                let suffix = 1;
                let finalKey = key;
                while (data[finalKey] !== undefined) {
                    finalKey = `${key}_${suffix++}`;
                }
                if (field.type === 'checkbox') {
                    data[finalKey] = field.checked === true;
                } else if (field.type === 'radio') {
                    data[finalKey] = field.value || '';
                } else if (field.type === 'signature') {
                    // 图片签名带模式标记，文字签名存字符串
                    data[finalKey] = field.signatureImage ? { mode: 'image', data: field.signatureImage } : (field.value || '');
                } else {
                    data[finalKey] = field.value || '';
                }
            }
            return data;
        }

        // ============================================================
        // ✅ 核心修复：可靠的字段类型检测（同时支持复选框和文本）
        // ============================================================

        function isCheckBox(field) {
            // 有 check/uncheck 方法，且没有 getOptions（RadioGroup/Dropdown 才有 getOptions）。
            // ⚠️ 压缩版 pdf-lib 中构造函数名不可靠（复选框/签名/PDFName 都叫 'e'），只按方法判断。
            return typeof field.check === 'function' &&
                typeof field.uncheck === 'function' &&
                typeof field.getOptions !== 'function';
        }

        function isTextField(field) {
            // setText 是文本字段独有的方法（CheckBox/RadioGroup/Dropdown/Signature 都没有）
            return typeof field.setText === 'function';
        }

        function isRadioGroup(field) {
            // 单选组：有 getOptions/select，但没有 addOptions（dropdown/listbox 才有 addOptions）。
            return typeof field.getOptions === 'function' &&
                typeof field.select === 'function' &&
                typeof field.addOptions !== 'function';
        }

        function isDropdown(field) {
            return typeof field.select === 'function' &&
                typeof field.getOptions === 'function' &&
                typeof field.getSelected === 'function';
        }

        function isSignature(field) {
            // needsAppearancesUpdate 是 PDFSignature 独有的方法
            return typeof field.needsAppearancesUpdate === 'function';
        }

        function getFieldTypeName(field) {
            if (isCheckBox(field)) return 'PDFCheckBox';
            if (isTextField(field)) return 'PDFTextField';
            if (isRadioGroup(field)) return 'PDFRadioGroup';
            if (isDropdown(field)) return 'PDFDropdown';
            if (isSignature(field)) return 'PDFSignature';
            return 'unknown';
        }

        // ============================================================
        // ✅ 自签名证书 + PKCS#7 分离数字签名（浏览器内完成）
        // 依赖全局 PDFSigner（pdfsigner.bundle.js，esbuild 打包的 pkijs/asn1js）
        // ============================================================

        function bytesToLatin1(bytes) {
            let s = '';
            const CHUNK = 8192;
            for (let i = 0; i < bytes.length; i += CHUNK) {
                s += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
            }
            return s;
        }
        function latin1ToBytes(str) {
            const out = new Uint8Array(str.length);
            for (let i = 0; i < str.length; i++) out[i] = str.charCodeAt(i) & 0xff;
            return out;
        }
        function bytesToHex(bytes) {
            let s = '';
            for (let i = 0; i < bytes.length; i++) s += bytes[i].toString(16).padStart(2, '0');
            return s;
        }

        // 会话级缓存：同一会话多次导出复用同一自签名证书，避免每次都生成 RSA 密钥
        let cachedDigitalSigner = null;

        // 生成自签名 X.509 证书 + RSA-2048 密钥对（用浏览器 WebCrypto）
        async function makeSelfSignedCert(pkijs, asn1js) {
            const keyPair = await crypto.subtle.generateKey(
                { name: 'RSASSA-PKCS1-v1_5', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' },
                true, ['sign', 'verify']
            );
            const cert = new pkijs.Certificate();
            cert.version = 2;
            cert.serialNumber = new asn1js.Integer({ valueHex: crypto.getRandomValues(new Uint8Array(16)) });
            const name = new pkijs.RelativeDistinguishedNames();
            name.typesAndValues = [
                new pkijs.AttributeTypeAndValue({ type: '2.5.4.3', value: new asn1js.Utf8String({ value: 'pdf-form-filler self-signed' }) }),
            ];
            cert.subject = name;
            cert.issuer = name;
            const now = new Date();
            const notAfter = new Date();
            notAfter.setFullYear(notAfter.getFullYear() + 5);
            cert.notBefore = new pkijs.Time({ type: 0, value: now });
            cert.notAfter = new pkijs.Time({ type: 0, value: notAfter });
            const spki = await crypto.subtle.exportKey('spki', keyPair.publicKey);
            cert.subjectPublicKeyInfo = new pkijs.PublicKeyInfo({ schema: asn1js.fromBER(spki).result });
            const ekuSeq = new asn1js.Sequence({ value: [new asn1js.ObjectIdentifier({ value: '1.3.6.1.5.5.7.3.4' })] });
            cert.extensions = [
                new pkijs.Extension({
                    extnID: '2.5.29.19', critical: true,
                    extnValue: new asn1js.OctetString({ valueHex: new pkijs.BasicConstraints({ cA: false }).toSchema().toBER(false) }).valueHex,
                }),
                new pkijs.Extension({
                    extnID: '2.5.29.37', critical: false,
                    extnValue: new asn1js.OctetString({ valueHex: ekuSeq.toBER(false) }).valueHex,
                }),
            ];
            await cert.sign(keyPair.privateKey, 'SHA-256');
            return { cert, privateKey: keyPair.privateKey };
        }

        async function ensureDigitalSigner() {
            if (cachedDigitalSigner) return cachedDigitalSigner;
            const { pkijs, asn1js } = PDFSigner;
            pkijs.setEngine('webcrypto', crypto, crypto.subtle);
            cachedDigitalSigner = await makeSelfSignedCert(pkijs, asn1js);
            return cachedDigitalSigner;
        }

        // 手动构造 CMS（adbe.pkcs7.detached）并签名
        async function buildCmsSignature(cert, privateKey, digestBytes, signingTime, pkijs, asn1js) {
            const OID_SHA256 = '2.16.840.1.101.3.4.2.1';
            const OID_RSA = '1.2.840.113549.1.1.1';
            const OID_DATA = '1.2.840.113549.1.7.1';
            const OID_SIGNED_DATA = '1.2.840.113549.1.7.2';
            const OID_ATTR_CONTENT_TYPE = '1.2.840.113549.1.9.3';
            const OID_ATTR_SIGNING_TIME = '1.2.840.113549.1.9.5';
            const OID_ATTR_MESSAGE_DIGEST = '1.2.840.113549.1.9.4';
            const oid = (v) => new asn1js.ObjectIdentifier({ value: v });
            const nullAlg = (v) => new asn1js.Sequence({ value: [oid(v), new asn1js.Null()] });
            const attribute = (typeOid, values) => new asn1js.Sequence({ value: [oid(typeOid), new asn1js.Set({ value: values })] });

            const certDer = new Uint8Array(cert.toSchema(true).toBER(false));
            const issuerName = cert.subject.toSchema().toBER(false);
            const serialNumber = cert.serialNumber;
            const timeAsn1 = signingTime.getUTCFullYear() >= 2050
                ? new asn1js.GeneralizedTime({ valueDate: signingTime })
                : new asn1js.UTCTime({ valueDate: signingTime });

            // signedAttrs 按 DER 排序：contentType < messageDigest < signingTime
            const attrSeqs = [
                attribute(OID_ATTR_CONTENT_TYPE, [oid(OID_DATA)]),
                attribute(OID_ATTR_MESSAGE_DIGEST, [new asn1js.OctetString({ valueHex: digestBytes })]),
                attribute(OID_ATTR_SIGNING_TIME, [timeAsn1]),
            ];
            const attrsSet = new asn1js.Set({ value: attrSeqs });
            const attrsDer = new Uint8Array(attrsSet.toBER(false));
            const signature = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', privateKey, attrsDer));

            const signedAttrs0 = new asn1js.Constructed({ idBlock: { tagClass: 3, tagNumber: 0 }, value: attrSeqs });
            const signerInfo = new asn1js.Sequence({
                value: [
                    new asn1js.Integer({ value: 1 }),
                    new asn1js.Sequence({ value: [asn1js.fromBER(issuerName).result, serialNumber] }),
                    nullAlg(OID_SHA256),
                    signedAttrs0,
                    nullAlg(OID_RSA),
                    new asn1js.OctetString({ valueHex: signature }),
                ],
            });
            const signedData = new asn1js.Sequence({
                value: [
                    new asn1js.Integer({ value: 1 }),
                    new asn1js.Set({ value: [nullAlg(OID_SHA256)] }),
                    new asn1js.Sequence({ value: [oid(OID_DATA)] }),
                    new asn1js.Constructed({ idBlock: { tagClass: 3, tagNumber: 0 }, value: [asn1js.fromBER(certDer).result] }),
                    new asn1js.Set({ value: [signerInfo] }),
                ],
            });
            const contentInfo = new asn1js.Sequence({
                value: [
                    oid(OID_SIGNED_DATA),
                    new asn1js.Constructed({ idBlock: { tagClass: 3, tagNumber: 0 }, value: [signedData] }),
                ],
            });
            return new Uint8Array(contentInfo.toBER(false));
        }

        // PDF ByteRange 分离签名（占位符已在字段 dict 里）
        async function signPdfBytes(pdfBytes, signer, pkijs, asn1js) {
            let pdf = bytesToLatin1(pdfBytes);
            const brPos = pdf.indexOf('/ByteRange');
            if (brPos < 0) throw new Error('未找到 /ByteRange 占位符');
            const brEnd = pdf.indexOf(']', brPos) + 1;
            const brPlaceholderLen = brEnd - brPos;
            const ctPos = pdf.indexOf('/Contents ', brEnd);
            const placeholderPos = pdf.indexOf('<', ctPos);
            const placeholderEnd = pdf.indexOf('>', placeholderPos);
            if (placeholderPos < 0 || placeholderEnd < 0) throw new Error('未找到 /Contents 占位符');
            const placeholderWithBrackets = placeholderEnd + 1 - placeholderPos;
            const placeholderHexLen = placeholderWithBrackets - 2;
            const byteRange = [0, placeholderPos, placeholderPos + placeholderWithBrackets, pdf.length - (placeholderPos + placeholderWithBrackets)];

            // 1) 替换 ByteRange 数字（等长，补空格）
            const actualBR = `/ByteRange [${byteRange.join(' ')}]`;
            const paddedBR = actualBR + ' '.repeat(Math.max(0, brPlaceholderLen - actualBR.length));
            pdf = pdf.slice(0, brPos) + paddedBR + pdf.slice(brEnd);

            // 2) 移除 Contents 占位符
            pdf = pdf.slice(0, byteRange[1]) + pdf.slice(byteRange[2]);

            // 3) 摘要 = sha256(整个缩短后的文件)
            const toHash = latin1ToBytes(pdf);
            const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', toHash));

            // 4) 构造 CMS 并签名
            const cmsDer = await buildCmsSignature(signer.cert, signer.privateKey, digest, new Date(), pkijs, asn1js);

            // 5) hex 化并补齐到占位符长度
            const hex = bytesToHex(cmsDer);
            if (hex.length > placeholderHexLen) throw new Error(`签名过大: ${hex.length} > ${placeholderHexLen}`);
            const paddedHex = hex + '0'.repeat(placeholderHexLen - hex.length);

            // 6) 回插 Contents
            pdf = pdf.slice(0, byteRange[1]) + `<${paddedHex}>` + pdf.slice(byteRange[1]);
            return latin1ToBytes(pdf);
        }

        // 对已保存的 PDF 字节应用数字签名（若 PDFSigner 未加载则跳过）
        async function applyDigitalSignature(pdfBytes) {
            if (!window.PDFSigner || !window.crypto || !window.crypto.subtle) {
                logDebug('⚠️ 数字签名组件未加载，跳过', '', 'error');
                return pdfBytes;
            }
            const { pkijs, asn1js } = window.PDFSigner;
            pkijs.setEngine('webcrypto', crypto, crypto.subtle);
            const signer = await ensureDigitalSigner();
            return await signPdfBytes(pdfBytes, signer, pkijs, asn1js);
        }

        // --- 导出填充后的 PDF ---
        async function exportFilledPDF() {
            if (!originalPdfData || originalPdfData.length === 0) {
                statusMessage.textContent = '❌ 没有原始 PDF 数据';
                alert('请先上传 PDF 文件');
                return;
            }

            exportProgress.classList.add('active');
            exportTitle.textContent = '正在生成 PDF...';
            exportProgressText.textContent = '加载 PDF 模板...';
            exportError.style.display = 'none';

            try {
                const pdfBytesCopy = new Uint8Array(originalPdfData);

                logDebug('📄 导出数据大小', `${pdfBytesCopy.length} 字节`);

                const headerStr = new TextDecoder().decode(pdfBytesCopy.slice(0, 8));
                logDebug('📄 导出头部', headerStr);

                if (!headerStr.startsWith('%PDF')) {
                    const pdfStart = pdfBytesCopy.indexOf('%PDF');
                    if (pdfStart > 0) {
                        const fixedData = new Uint8Array(pdfBytesCopy.slice(pdfStart));
                        pdfBytesCopy.set(fixedData);
                    } else {
                        throw new Error('PDF 文件格式无效，找不到 %PDF 头部');
                    }
                }

                exportProgressText.textContent = '正在解析 PDF 结构...';

                let pdfDocLib;
                try {
                    pdfDocLib = await PDFLib.PDFDocument.load(pdfBytesCopy, {
                        ignoreEncryption: true,
                    });
                } catch (loadError) {
                    logDebug('⚠️ 加载失败', loadError.message, 'error');
                    pdfDocLib = await PDFLib.PDFDocument.load(pdfBytesCopy);
                }

                const form = pdfDocLib.getForm();
                const fields = form.getFields();

                logDebug('📝 pdf-lib 字段', `${fields.length} 个`, 'ok');
                exportProgressText.textContent = `找到 ${fields.length} 个表单字段，正在填充...`;

                const formData = getFormData();

                // ✅ 统计各类型字段数量
                let totalCheckboxes = 0;
                let totalRadios = 0;
                let totalTexts = 0;
                let totalDropdowns = 0;
                let totalSignatures = 0;
                let totalOthers = 0;

                for (const field of fields) {
                    const fType = getFieldTypeName(field);
                    if (fType === 'PDFCheckBox') totalCheckboxes++;
                    else if (fType === 'PDFRadioGroup') totalRadios++;
                    else if (fType === 'PDFTextField') totalTexts++;
                    else if (fType === 'PDFDropdown') totalDropdowns++;
                    else if (fType === 'PDFSignature') totalSignatures++;
                    else totalOthers++;
                }
                logDebug('📊 字段统计',
                    `复选框:${totalCheckboxes}, 单选:${totalRadios}, 文本:${totalTexts}, 下拉:${totalDropdowns}, 签名:${totalSignatures}, 其他:${totalOthers}`);

                let filledCount = 0;

                // 签名字段：pdf-lib 无法直接 setText，改为把文字绘制到页面上（flatten）
                const sigFieldInfoMap = {};
                for (const fi of allFields) {
                    if (fi.type === 'signature') sigFieldInfoMap[fi.name] = fi;
                }
                let sigFont = null;

                // 数字签名：仅对第一个有值的签名字段添加 PKCS#7 占位符（v1 单签名）
                const SIG_PLACEHOLDER_HEX_LEN = 8192;
                let digitalSigRequested = false;

                // ✅ 遍历所有字段并填充
                for (const field of fields) {
                    const fieldName = field.getName();
                    const value = formData[fieldName];
                    const fType = getFieldTypeName(field);

                    // 没有数据，跳过（保持原样）
                    if (value === undefined || value === null) {
                        continue;
                    }

                    // 复选框且值为空字符串，跳过
                    if (fType === 'PDFCheckBox' && value === '') {
                        continue;
                    }

                    try {
                        if (fType === 'PDFTextField' || fType === 'PDFTextArea') {
                            field.setText(String(value));
                            filledCount++;
                            logDebug(`📝 填充文本`, `${fieldName} = "${String(value).substring(0, 20)}"`, 'ok');
                        } else if (fType === 'PDFCheckBox') {
                            const shouldCheck = value === true ||
                                value === 'true' ||
                                value === 'Yes' ||
                                value === 'on' ||
                                value === '1';
                            if (shouldCheck) {
                                field.check();
                            } else {
                                field.uncheck();
                            }
                            filledCount++;
                        } else if (fType === 'PDFRadioGroup') {
                            try {
                                const options = field.getOptions();
                                if (options && options.length > 0) {
                                    if (value === true || value === 'true' || value === 'Yes' || value === 'on') {
                                        field.select(options[0]);
                                    } else if (typeof value === 'string') {
                                        let selected = null;
                                        for (const opt of options) {
                                            if (String(value).toLowerCase() === String(opt).toLowerCase()) {
                                                selected = opt;
                                                break;
                                            }
                                        }
                                        if (selected) field.select(selected);
                                    }
                                    filledCount++;
                                }
                            } catch (e) {
                                logDebug(`⚠️ Radio 填充失败 ${fieldName}`, e.message);
                            }
                        } else if (fType === 'PDFDropdown' || fType === 'PDFListBox') {
                            try {
                                field.select(String(value));
                                filledCount++;
                            } catch (e) {
                                logDebug(`⚠️ 下拉列表填充失败 ${fieldName}`, e.message);
                            }
                        } else if (fType === 'PDFSignature') {
                            // 签名：优先嵌入手绘/上传的图片，否则把文字画到页面字段位置上
                            try {
                                const info = sigFieldInfoMap[fieldName];
                                const rect = (info && info.rawRect && info.rawRect.length === 4) ? info.rawRect : null;
                                const imageDataUrl = info && info.signatureImage;

                                if (imageDataUrl && rect) {
                                    // 1) 图片签名：嵌入 PNG
                                    const b64 = String(imageDataUrl).split(',')[1];
                                    if (b64) {
                                        const bin = atob(b64);
                                        const imgBytes = new Uint8Array(bin.length);
                                        for (let i = 0; i < bin.length; i++) imgBytes[i] = bin.charCodeAt(i);
                                        const img = await pdfDocLib.embedPng(imgBytes);
                                        const pages = pdfDocLib.getPages();
                                        const page = pages[info.pageIndex] || pages[0];
                                        if (page) {
                                            const boxW = rect[2] - rect[0];
                                            const boxH = rect[3] - rect[1];
                                            const dims = img.scaleToFit(Math.max(boxW - 4, 1), Math.max(boxH - 4, 1));
                                            page.drawImage(img, {
                                                x: rect[0] + (boxW - dims.width) / 2,
                                                y: rect[1] + (boxH - dims.height) / 2,
                                                width: dims.width,
                                                height: dims.height,
